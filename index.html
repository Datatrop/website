    <!-- Brand intro (src/IntroOverlay.jsx), played once per visit (browser
         session). Decided before the app boots so the site never flashes up
         first. Skipped on refreshes within the same visit, for reduced-motion
         users, crawlers, and admin/legal pages. -->
    <script>
      (function () {
        try {
          if (/^\/(admin|privacy|terms)/.test(location.pathname)) return;
          if (sessionStorage.getItem('datatrop_intro_played')) return;
          if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (/bot|crawl|spider|slurp|lighthouse|headless|preview/i.test(navigator.userAgent)) return;
          var el = document.documentElement;
          el.classList.add('intro-playing');
          setTimeout(function () { el.classList.remove('intro-playing'); }, 15000);
        } catch (e) {}
      })();
    </script>
